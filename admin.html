  <style>
    body { padding: 32px; background: var(--bg); color: var(--text); }
    .wrap { display: grid; grid-template-columns: 420px 1fr; gap: 24px; align-items: start; }
    form.admin-form { display: grid; gap: 10px; background: var(--card); border:1px solid var(--line); border-radius: 16px; padding: 16px; }
    label { font-weight: 600; font-size: 13px; }
    input, select { padding: 10px; border-radius: 10px; border:1px solid var(--line); background: var(--bg-elev); color: var(--text); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btnx { padding: 10px 14px; border-radius: 10px; border:1px solid var(--line); background: var(--bg-elev); color: var(--text); font-weight: 600; cursor: pointer; }
    .btnx.primary { background:#0044d6; border-color: transparent; color: #fff; }
    .btnx.danger { background:#8b0000; border-color: transparent; color: #fff; }
    .hint { color: var(--muted); font-size: 12px; margin-top: -6px; }
    .list { background: var(--card); border:1px solid var(--line); border-radius: 16px; padding: 12px; }
    .toolbar { display:flex; gap:8px; justify-content: space-between; align-items:center; margin-bottom: 8px; }
    .search { flex:1; }
    .search input { width:100%; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
    tr:hover { background: rgba(255,255,255,.02); }
    .cell-actions { display:flex; gap:6px; }
    .pill-mini { padding: 4px 8px; border:1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted); }
    .preview { border:1px dashed var(--line); border-radius: 12px; padding: 8px; display:grid; place-items:center; background: #0e141c; }
    .preview img { max-width: 100%; height: auto; display:block; border-radius: 8px; }
    @media (max-width: 1024px){ .wrap { grid-template-columns: 1fr; } }

    form .row{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: end;
    }
    form .row > div,
    #povodnaCenaWrap,
    #novaCenaWrap,
    form > div:not(.row):not(.actions){
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    form label{ margin-bottom: 0; line-height: 1.2; }
    form input:not([type="checkbox"]):not([type="file"]),
    form select, form textarea{ width:100%; height:42px; }
    form input[type="checkbox"]{ width:auto; height:auto; }

    .row--image{ grid-template-columns: 1fr; }
    .upload-inline{
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }
    .upload-inline input[type="file"]{ height:42px; }
    .upload-inline .btnx{ height:42px; }
    .preview{ margin-top: 8px; }
    /* PROGRESS OVERLAY */
.progress-overlay{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 16px;
}
.progress-card{
  width: min(520px, 100%);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
}
.progress-title{
  font-weight: 800;
  font-size: 14px;
  margin-bottom: 12px;
}
.progress-bar{
  width: 100%;
  height: 10px;
  background: rgba(255,255,255,.08);
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill{
  height: 100%;
  width: 0%;
  background: #0044d6;
  transition: width .2s ease;
}
.progress-meta{
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  color: var(--muted);
}
.progress-percent{
  font-variant-numeric: tabular-nums;
}

  </style>
</head>

    // =============================
    // CONFIG
    // =============================
    const API_BASE = (location.protocol === 'file:')
      ? 'https://ppauto.sk'
      : location.origin;

    const apiUrl = (path) => `${API_BASE}${path}`;

    // =============================
    // STATE + ELEMENTS
    // =============================
    let cars = [];

    const filterBrand = document.getElementById('filterBrand');
    const filterYear = document.getElementById('filterYear');
    const filterPrice = document.getElementById('filterPrice');

    const form = document.getElementById('carForm');
    const editIndexInput = document.getElementById('editIndex');
    const submitBtn = document.getElementById('submitBtn');

    const deleteBtn = document.getElementById('deleteBtn');
    const hideBtn = document.getElementById('hideBtn');
    const unhideBtn = document.getElementById('unhideBtn');

    const zlava = document.getElementById('zlava');
    const skryte = document.getElementById('skryte');
    const novaCenaWrap = document.getElementById('novaCenaWrap');

    const tableBody = document.querySelector('#carsTable tbody');
    const searchInput = document.getElementById('search');
    const checkAll = document.getElementById('checkAll');
    const showHidden = document.getElementById('showHidden');

    // nové: titulka + galéria
    const titulkaInput = document.getElementById('titulkaInput');
    const galeriaInput = document.getElementById('galeriaInput');
    const titulkaPreview = document.getElementById('titulkaPreview');
    const galeriaPreview = document.getElementById('galeriaPreview');

    // =============================
    // INIT
    // =============================
    if (tableBody) {
      tableBody.addEventListener('click', (e) => {
        const el = (e.target instanceof Element) ? e.target : e.target?.parentElement;
        if (!el) return;

        const editBtn = el.closest('[data-edit]');
        if (editBtn) {
          e.preventDefault();
          const idx = parseInt(editBtn.dataset.edit, 10);
          if (!Number.isNaN(idx)) onEdit(idx);
          return;
        }

        const delBtn = el.closest('[data-del]');
        if (delBtn) {
          e.preventDefault();
          const idx = parseInt(delBtn.dataset.del, 10);
          if (!Number.isNaN(idx)) onDelete(idx);
          return;
        }

        const hideOneBtn = el.closest('[data-hide]');
        if (hideOneBtn) {
          e.preventDefault();
          const idx = parseInt(hideOneBtn.dataset.hide, 10);
          if (!Number.isNaN(idx)) onSetHidden([idx], true);
          return;
        }

        const unhideOneBtn = el.closest('[data-unhide]');
        if (unhideOneBtn) {
          e.preventDefault();
          const idx = parseInt(unhideOneBtn.dataset.unhide, 10);
          if (!Number.isNaN(idx)) onSetHidden([idx], false);
          return;
        }
      });
    } else {
      console.error('Chýba #carsTable tbody – nenašiel som tableBody.');
    }

    filterBrand && filterBrand.addEventListener('change', renderTable);
    filterYear && filterYear.addEventListener('change', renderTable);
    filterPrice && filterPrice.addEventListener('change', renderTable);

    document.getElementById('reloadBtn').addEventListener('click', loadFromApi);
    document.getElementById('exportBtn').addEventListener('click', exportJSON);
    document.getElementById('resetBtn').addEventListener('click', () => setFormMode('create'));

    deleteBtn.addEventListener('click', onDeleteSelected);
    hideBtn.addEventListener('click', () => onSetHiddenSelected(true));
    unhideBtn.addEventListener('click', () => onSetHiddenSelected(false));

    searchInput.addEventListener('input', renderTable);
    zlava.addEventListener('change', toggleZlavaUI);
    showHidden.addEventListener('change', renderTable);

    checkAll.addEventListener('change', () => {
      document.querySelectorAll('.row-check').forEach(cb => cb.checked = checkAll.checked);
      updateBulkActionUI();
    });

    // náhľad titulky
    titulkaInput?.addEventListener('change', () => {
      const f = titulkaInput.files?.[0];
      if (!f) return;
      titulkaPreview.innerHTML = `<img src="${URL.createObjectURL(f)}" alt="titulka">`;
    });

    // náhľad galérie
    galeriaInput?.addEventListener('change', () => {
      galeriaPreview.innerHTML = '';
      [...(galeriaInput.files || [])].forEach(f => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(f);
        img.style.maxWidth = '120px';
        img.style.margin = '4px';
        galeriaPreview.appendChild(img);
      });
    });

let PROGRESS_DONE = 0;


function normalizeGearbox(raw) {
  const s = String(raw || '').trim().toUpperCase();
  // typicky chceme AT / MT; ale necháme aj iné hodnoty, len ich očistíme
  return s.replace(/\s+/g, '');
}

function parseLegacyPrevodovka(raw) {
  const txt = String(raw || '').trim();
  if (!txt) return { typ: '', paket: '' };

  const parts = txt
    .split(/•|·|\|/g)
    .map(p => p.trim())
    .filter(Boolean);

  if (!parts.length) return { typ: '', paket: '' };

  if (parts.length === 1) {
    const one = normalizeGearbox(parts[0]);
    // heuristika: ak je to AT/MT/CVT/DCT/DSG tak to ber ako typ, inak ako paket
    if (/^(AT|MT|CVT|DCT|DSG)$/.test(one)) return { typ: one, paket: '' };
    return { typ: '', paket: parts[0] };
  }

  return { typ: normalizeGearbox(parts[0]), paket: parts.slice(1).join(' • ') };
}

function buildLegacyPrevodovka(typ, paket) {
  const t = String(typ || '').trim();
  const p = String(paket || '').trim();
  if (t && p) return `${t} • ${p}`;
  if (t) return t;
  if (p) return p;
  return '';
}

function displayPrevodovkaForSearch(car) {
  const legacy = String(car?.prevodovka || '').trim();
  if (legacy) return legacy;

  const typ = normalizeGearbox(car?.typ_prevodovky || '');
  const paket = String(car?.vybava_paket || '').trim();
  return buildLegacyPrevodovka(typ, paket);
}



function showProgress(totalSteps = 1, text = 'Pracujem…') {
  PROGRESS_TOTAL = Math.max(1, Number(totalSteps) || 1);
  PROGRESS_DONE = 0;

  if (progressOverlay) progressOverlay.hidden = false;
  setProgress(0, text);
}

function setProgress(doneSteps, text) {
  PROGRESS_DONE = Math.min(PROGRESS_TOTAL, Math.max(0, Number(doneSteps) || 0));
  const pct = Math.round((PROGRESS_DONE / PROGRESS_TOTAL) * 100);

  if (progressFill) progressFill.style.width = `${pct}%`;
  if (progressText) progressText.textContent = text || 'Pracujem…';
  if (progressPercent) progressPercent.textContent = `${pct}%`;
}

function stepProgress(text) {
  setProgress(PROGRESS_DONE + 1, text);
}

function hideProgress() {
  if (progressOverlay) progressOverlay.hidden = true;
  PROGRESS_TOTAL = 1;
  PROGRESS_DONE = 0;
  if (progressFill) progressFill.style.width = `0%`;
  if (progressText) progressText.textContent = '';
  if (progressPercent) progressPercent.textContent = `0%`;
}

    async function loadFromApi({ withProgress = true } = {}) {
  if (withProgress) showProgress(1, 'Načítavam autá…');

  try {
    const res = await fetch(apiUrl('/api/cars?include_hidden=1'), { cache: 'no-store' });
    if (!res.ok) {
      const t = await res.text().catch(() => '');
      throw new Error(`GET /api/cars failed: ${res.status} ${t}`);
    }

    cars = await res.json();

    if (filterBrand) filterBrand.value = '';
    if (filterYear) filterYear.value = '';
    if (filterPrice) filterPrice.value = '';
    searchInput.value = '';

    renderTable();

    if (withProgress) setProgress(1, 'Hotovo');
  } catch (e) {
    console.error('Nepodarilo sa načítať /api/cars', e);
    cars = [];
    renderTable();
  } finally {
    if (withProgress) hideProgress();
  }
}

    function slugify(input) {
      return String(input || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .replace(/-{2,}/g, '-');
    }

    function generateUniqueCarId(base, usedIds) {
      const cleanBase = slugify(base) || 'auto';
      let id = cleanBase;
      let n = 1;
      while (usedIds.has(id)) {
        n += 1;
        id = `${cleanBase}-${n}`;
      }
      return id;
    }

    async function onDeleteSelected() {
  const selected = getSelectedIndexes();

  if (!selected.length) {
    alert('Nevybral si žiadne autá.');
    return;
  }

  if (!confirm(`Naozaj vymazať ${selected.length} áut?`)) return;

  const indexes = [...selected].sort((a, b) => b - a);

  showProgress(indexes.length + 1, `Mažem ${indexes.length} áut…`);

  try {
    let done = 0;

    for (const idx of indexes) {
      const r = await fetch(apiUrl(`/api/cars?index=${idx}`), { method: 'DELETE' });
      if (!r.ok) {
        const t = await r.text().catch(() => '');
        console.error('Delete failed:', r.status, t);
        alert('Vymazanie zlyhalo (' + r.status + '). Pozri konzolu.');
        return;
      }
      done++;
      setProgress(done, `Vymazané ${done}/${indexes.length}…`);
    }

    // „+1“ krok: refresh
    setProgress(indexes.length, 'Obnovujem zoznam…');
    await loadFromApi({ withProgress: false });
    setFormMode('create');
    setProgress(indexes.length + 1, 'Hotovo');

  } catch (err) {
    console.error(err);
    alert('Vymazanie zlyhalo (chyba siete alebo servera).');
  } finally {
    hideProgress();
  }
}

    async function onSetHidden(indexes, hidden) {
  showProgress(indexes.length + 1, hidden ? 'Skrývam autá…' : 'Zobrazujem autá…');

  try {
    for (const idx of indexes) {
      const current = cars[idx];
      if (!current) continue;

      const updated = { ...current, skryte: !!hidden };

      const r = await fetch(apiUrl(`/api/cars?index=${idx}`), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(updated)
      });

      if (!r.ok) {
        const t = await r.text().catch(() => '');
        console.error('Hide/Unhide failed:', r.status, t);
        alert('Skrytie/Zobrazenie zlyhalo (' + r.status + '). Pozri konzolu.');
        return;
      }

      stepProgress(hidden ? 'Skrývam…' : 'Zobrazujem…');
    }

    await loadFromApi({ withProgress: false });
    setFormMode('create');
    setProgress(PROGRESS_TOTAL, 'Hotovo');
  } catch (err) {
    console.error(err);
    alert('Skrytie/Zobrazenie zlyhalo (chyba siete alebo servera).');
  } finally {
    hideProgress();
  }
}

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Nepodarilo sa načítať súbor.'));
        reader.onload = () => {
          const result = reader.result;
          const base64 = String(result).split(',')[1];
          resolve(base64);
        };
        reader.readAsDataURL(file);
      });
    }

    async function uploadImage(file) {
      if (!file) return '';

      if (file.size > 10 * 1024 * 1024) {
        throw new Error('Súbor je príliš veľký (max 10 MB).');
      }

      const base64 = await fileToBase64(file);

      const up = await fetch(apiUrl('/api/upload-image'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          filename: file.name,
          contentBase64: base64
        })
      });

      if (!up.ok) {
        const t = await up.text().catch(() => '');
        console.error('Upload failed:', up.status, t);
        throw new Error('Nahratie obrázka zlyhalo (' + up.status + ').');
      }

      const upData = await up.json().catch(() => ({}));
      return upData.url || '';
    }

    toggleZlavaUI();
loadFromApi();
  </script>
