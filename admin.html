<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin panel – PP AUTO</title>
  <link rel="stylesheet" href="style.css"/>

  <style>
    body { padding: 32px; background: var(--bg); color: var(--text); }
    .wrap { display: grid; grid-template-columns: 420px 1fr; gap: 24px; align-items: start; }
    form { display: grid; gap: 10px; background: var(--card); border:1px solid var(--line); border-radius: 16px; padding: 16px; }
    label { font-weight: 600; font-size: 13px; }
    input, select { padding: 10px; border-radius: 10px; border:1px solid var(--line); background: var(--bg-elev); color: var(--text); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btnx { padding: 10px 14px; border-radius: 10px; border:1px solid var(--line); background: var(--bg-elev); color: var(--text); font-weight: 600; cursor: pointer; }
    .btnx.primary { background:#0044d6; border-color: transparent; color: #fff; }
    .btnx.danger { background:#8b0000; border-color: transparent; color: #fff; }
    .hint { color: var(--muted); font-size: 12px; margin-top: -6px; }
    .list { background: var(--card); border:1px solid var(--line); border-radius: 16px; padding: 12px; }
    .toolbar { display:flex; gap:8px; justify-content: space-between; align-items:center; margin-bottom: 8px; }
    .search { flex:1; }
    .search input { width:100%; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
    tr:hover { background: rgba(255,255,255,.02); }
    .cell-actions { display:flex; gap:6px; }
    .pill-mini { padding: 4px 8px; border:1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted); }
    .preview { border:1px dashed var(--line); border-radius: 12px; padding: 8px; display:grid; place-items:center; background: #0e141c; }
    .preview img { max-width: 100%; height: auto; display:block; border-radius: 8px; }
    @media (max-width: 1024px){ .wrap { grid-template-columns: 1fr; } }

    form .row{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: end;
    }
    form .row > div,
    #povodnaCenaWrap,
    #novaCenaWrap,
    form > div:not(.row):not(.actions){
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    form label{ margin-bottom: 0; line-height: 1.2; }
    form input:not([type="checkbox"]):not([type="file"]),
    form select, form textarea{ width:100%; height:42px; }
    form input[type="checkbox"]{ width:auto; height:auto; }

    .row--image{ grid-template-columns: 1fr; }
    .upload-inline{
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }
    .upload-inline input[type="file"]{ height:42px; }
    .upload-inline .btnx{ height:42px; }
    .preview{ margin-top: 8px; }
  </style>
</head>
<body>

  <h2>🛠️ Admin panel – správa áut</h2>

  <div class="wrap">
    <!-- FORM -->
    <form id="carForm">
      <label><input type="checkbox" id="zlava"> Toto auto je v zľave</label>

      <div class="row">
        <div>
          <label>Značka</label>
          <input type="text" id="znacka" name="znacka" placeholder="Subaru" />
        </div>
        <div>
          <label>Model</label>
          <input type="text" id="model" name="model" placeholder="BRZ" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>Rok</label>
          <input type="number" id="rok" name="rok" placeholder="2024" />
        </div>
        <div>
          <label>Palivo</label>
          <input type="text" id="palivo" name="palivo" placeholder="Benzín"/>
        </div>
      </div>

      <div>
        <label>Prevodovka / Výbava</label>
        <input type="text" id="prevodovka" name="prevodovka" placeholder="AT • Premium"/>
      </div>

      <div id="povodnaCenaWrap">
        <label>Pôvodná cena (alebo aktuálna, ak zľava NIE JE)</label>
        <input type="text" id="stara_cena" name="stara_cena" placeholder="43 840 €"/>
      </div>

      <div id="novaCenaWrap" style="display:none">
        <label>Aktuálna cena po zľave</label>
        <input type="text" id="nova_cena" name="nova_cena" placeholder="39 900 €"/>
        <div class="hint">Zobrazí sa zelenou, „Pôvodná cena“ bude prečiarknutá.</div>
      </div>

      <div>
        <label>Obrázok</label>

        <!-- skryté pole – sem sa po odoslaní uloží URL z uploadu -->
        <input type="hidden" id="obrazok" name="obrazok" />

        <div class="row row--image">
          <div class="upload-inline">
            <input type="file" id="fileInput" accept="image/*" />
          </div>
        </div>

        <div class="preview" id="imgPreview">
          <small class="hint">Vyber súbor. Pri „Odoslať“ sa automaticky nahrá a uloží.</small>
        </div>
      </div>

      <div>
        <label>Tagy (čiarkou oddelené)</label>
        <input type="text" id="tagy" name="tagy" placeholder="subaru, skladom"/>
      </div>

      <div class="actions">
        <button class="btnx primary" id="submitBtn" type="submit">Odoslať</button>
        <button class="btnx" type="button" id="resetBtn">Vyčistiť formulár</button>
        <button class="btnx danger" type="button" id="deleteBtn" style="display:none">Vymazať vybrané</button>
      </div>

      <!-- skryté: index upravovaného záznamu -->
      <input type="hidden" id="editIndex" value="-1"/>
    </form>

    <!-- LIST -->
    <div class="list">
      <div class="toolbar">
        <div class="search"><input type="text" id="search" placeholder="Hľadať v ponuke…"></div>
        <div class="actions">
          <button class="btnx" id="exportBtn" type="button">Exportovať auta.json</button>
          <button class="btnx" id="reloadBtn" type="button">Načítať zo súboru</button>
        </div>
      </div>

      <table id="carsTable">
        <thead>
          <tr>
            <th><input type="checkbox" id="checkAll"></th>
            <th>#</th>
            <th>Značka</th>
            <th>Model</th>
            <th>Rok</th>
            <th>Cena</th>
            <th>Tagy</th>
            <th>Akcie</th>
          </tr>
        </thead>
        <tbody><!-- render --></tbody>
      </table>
    </div>
  </div>

  <script>
  // =============================
  // CONFIG
  // =============================
  // Ak admin.html beží na rovnakej doméne ako /api, nechaj to tak (origin).
  // Ak admin.html otváraš lokálne (file://) alebo z inej domény,
  // nastav sem tvoju Vercel doménu, napr.: "https://ppauto-admin.vercel.app"
  const API_BASE = (location.protocol === 'file:')
    ? 'https://TVOJ-PROJEKT.vercel.app'   // <-- ZMEŇ!
    : location.origin;

  const apiUrl = (path) => `${API_BASE}${path}`;

  // =============================
  // STATE + ELEMENTS
  // =============================
  let cars = [];

  const form = document.getElementById('carForm');
  const editIndexInput = document.getElementById('editIndex');
  const submitBtn = document.getElementById('submitBtn');
  const deleteBtn = document.getElementById('deleteBtn');

  const zlava = document.getElementById('zlava');
  const novaCenaWrap = document.getElementById('novaCenaWrap');

  const imgInput = document.getElementById('obrazok');
  const imgPreview = document.getElementById('imgPreview');
  const fileEl = document.getElementById('fileInput');

  const tableBody = document.querySelector('#carsTable tbody');
  const searchInput = document.getElementById('search');
  const checkAll = document.getElementById('checkAll');

  // =============================
  // INIT
  // =============================
  // Delegovaný klik pre Upraviť / Vymazať (funguje aj po re-renderi)
  if (tableBody) {
    tableBody.addEventListener('click', (e) => {
      // ochrana pre prípad, že target nie je Element
      const el = (e.target instanceof Element) ? e.target : e.target?.parentElement;
      if (!el) return;

      const editBtn = el.closest('[data-edit]');
      if (editBtn) {
        e.preventDefault();
        const idx = parseInt(editBtn.dataset.edit, 10);
        if (!Number.isNaN(idx)) onEdit(idx);
        return;
      }

      const delBtn = el.closest('[data-del]');
      if (delBtn) {
        e.preventDefault();
        const idx = parseInt(delBtn.dataset.del, 10);
        if (!Number.isNaN(idx)) onDelete(idx);
        return;
      }
    });
  } else {
    console.error('Chýba #carsTable tbody – nenašiel som tableBody.');
  }

  document.getElementById('reloadBtn').addEventListener('click', loadFromApi);
  document.getElementById('exportBtn').addEventListener('click', exportJSON);
  document.getElementById('resetBtn').addEventListener('click', () => setFormMode('create'));
  deleteBtn.addEventListener('click', onDeleteSelected);
  searchInput.addEventListener('input', renderTable);
  zlava.addEventListener('change', toggleZlavaUI);

  // select-all checkbox
  checkAll.addEventListener('change', () => {
    document.querySelectorAll('.row-check').forEach(cb => cb.checked = checkAll.checked);
    updateBulkDeleteUI();
  });

  // náhľad po výbere súboru
  fileEl.addEventListener('change', () => {
    if (!fileEl.files || !fileEl.files[0]) {
      imgPreview.innerHTML = '<small class="hint">Vyber súbor. Pri „Odoslať“ sa automaticky nahrá a uloží.</small>';
      return;
    }
    const url = URL.createObjectURL(fileEl.files[0]);
    imgPreview.innerHTML = `<img src="${url}" alt="náhľad">`;
  });

  toggleZlavaUI();
  loadFromApi();
  renderPreview();

  // =============================
  // UI HELPERS
  // =============================
  function toggleZlavaUI() {
    if (zlava.checked) {
      novaCenaWrap.style.display = 'block';
    } else {
      novaCenaWrap.style.display = 'none';
      // bezpečne cez elements (spoľahlivejšie než form.nova_cena)
      const novaCenaEl = form.elements['nova_cena'];
      if (novaCenaEl) novaCenaEl.value = '';
    }
  }

  function renderPreview() {
    const url = (imgInput.value || '').trim();
    if (!url) {
      imgPreview.innerHTML = '<small class="hint">Vyber súbor. Pri „Odoslať“ sa automaticky nahrá a uloží.</small>';
      return;
    }
    imgPreview.innerHTML = `<img src="${url}" alt="náhľad obrázka">`;
  }

  function setFormMode(mode, index = -1) {
    if (mode === 'create') {
      form.reset();
      editIndexInput.value = -1;
      submitBtn.textContent = 'Odoslať';
      deleteBtn.style.display = 'none';
      checkAll.checked = false;

      zlava.checked = false;
      toggleZlavaUI();

      imgInput.value = '';
      fileEl.value = '';
      renderPreview();
    } else if (mode === 'edit') {
      editIndexInput.value = index;
      submitBtn.textContent = 'Uložiť zmeny';
      deleteBtn.style.display = 'none';
      toggleZlavaUI();
      renderPreview();
    }
  }

  function updateBulkDeleteUI() {
    const all = document.querySelectorAll('.row-check');
    const checked = document.querySelectorAll('.row-check:checked');

    checkAll.checked = all.length > 0 && all.length === checked.length;
    deleteBtn.style.display = checked.length ? 'inline-flex' : 'none';
  }

  // =============================
  // DATA IO
  // =============================
  async function loadFromApi() {
    try {
      const res = await fetch(apiUrl('/api/cars'), { cache: 'no-store' });
      if (!res.ok) {
        const t = await res.text().catch(() => '');
        throw new Error(`GET /api/cars failed: ${res.status} ${t}`);
      }
      cars = await res.json();
      renderTable();
    } catch (e) {
      console.error('Nepodarilo sa načítať /api/cars', e);
      cars = [];
      renderTable();
    }
  }

  function exportJSON() {
    const blob = new Blob([JSON.stringify(cars, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'auta.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // =============================
  // TABLE RENDER
  // =============================
  function renderTable() {
    checkAll.checked = false;
    deleteBtn.style.display = 'none';

    const q = searchInput.value.trim().toLowerCase();
    tableBody.innerHTML = '';

    cars
      .map((c, i) => ({ ...c, _i: i }))
      .filter(c => {
        const hay = [
          c.znacka, c.model, c.rok, c.palivo, c.prevodovka,
          (c.tagy || []).join(' ')
        ].join(' ').toLowerCase();
        return !q || hay.includes(q);
      })
      .forEach((c) => {
        const tr = document.createElement('tr');

        const cenaLabel = (c.nova_cena && String(c.nova_cena).trim() !== '')
          ? `${c.stara_cena || ''} → ${c.nova_cena}`
          : (c.stara_cena || '—');

        tr.innerHTML = `
          <td>
            <input type="checkbox" class="row-check" data-index="${c._i}">
          </td>
          <td>${c._i + 1}</td>
          <td>${c.znacka || ''}</td>
          <td>${c.model || ''}</td>
          <td>${c.rok ?? ''}</td>
          <td>${cenaLabel}</td>
          <td>${(c.tagy || []).join(', ')}</td>
          <td class="cell-actions">
            <button class="btnx" type="button" data-edit="${c._i}">Upraviť</button>
            <button class="btnx danger" type="button" data-del="${c._i}">Vymazať</button>
          </td>
        `;

        tableBody.appendChild(tr);

        tr.querySelector('.row-check').addEventListener('change', updateBulkDeleteUI);
      });
  }

  // =============================
  // CRUD
  // =============================
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const idx = parseInt(editIndexInput.value, 10);
    const isEdit = Number.isInteger(idx) && idx >= 0;

    const rokRaw = (form.elements['rok']?.value || '').trim();
    const znackaVal = (form.elements['znacka']?.value || '').trim();
    const modelVal = (form.elements['model']?.value || '').trim();

    if (!znackaVal || !modelVal) {
      alert('Vyplň značku a model.');
      return;
    }
    if (!rokRaw) {
      alert('Vyplň rok.');
      return;
    }

    // 1) upload (ak je vybraný nový súbor)
    let imageUrl = (form.elements['obrazok']?.value || '').trim();

    if (fileEl.files && fileEl.files[0]) {
      if (fileEl.files[0].size > 10 * 1024 * 1024) {
        alert('Súbor je príliš veľký (max 10 MB).');
        return;
      }

      const base64 = await fileToBase64(fileEl.files[0]);

      const up = await fetch(apiUrl('/api/upload-image'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          filename: fileEl.files[0].name,
          contentBase64: base64
        })
      });

      if (!up.ok) {
        const t = await up.text().catch(() => '');
        console.error('Upload failed:', up.status, t);
        alert('Nahratie obrázka zlyhalo (' + up.status + '). Pozri konzolu.');
        return;
      }

      const upData = await up.json().catch(() => ({}));
      imageUrl = upData.url || '';
      form.elements['obrazok'].value = imageUrl;
    }

    // 2) dáta auta
    const maZlavu = zlava.checked;

    const data = {
      znacka: znackaVal,
      model: modelVal,
      rok: Number(rokRaw),
      palivo: (form.elements['palivo']?.value || '').trim(),
      prevodovka: (form.elements['prevodovka']?.value || '').trim(),
      stara_cena: (form.elements['stara_cena']?.value || '').trim(),
      nova_cena: maZlavu ? (form.elements['nova_cena']?.value || '').trim() : '',
      obrazok: imageUrl,
      tagy: (form.elements['tagy']?.value || '')
        .split(',')
        .map(t => t.trim())
        .filter(Boolean)
    };

    // 3) uloženie cez API
    try {
      let r;
      if (isEdit) {
        r = await fetch(apiUrl(`/api/cars?index=${idx}`), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } else {
        r = await fetch(apiUrl('/api/cars'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      }

      if (!r.ok) {
        const t = await r.text().catch(() => '');
        console.error('Save failed:', r.status, t);
        alert('Uloženie zlyhalo (' + r.status + '). Pozri konzolu.');
        return;
      }

      await loadFromApi();
      setFormMode('create');

    } catch (err) {
      console.error(err);
      alert('Uloženie zlyhalo (chyba siete alebo servera).');
    }
  });

  function onEdit(index) {
    const a = cars[index];
    if (!a) return;

    form.elements['znacka'].value = a.znacka || '';
    form.elements['model'].value = a.model || '';
    form.elements['rok'].value = a.rok ?? '';
    form.elements['palivo'].value = a.palivo || '';
    form.elements['prevodovka'].value = a.prevodovka || '';
    form.elements['stara_cena'].value = a.stara_cena || '';
    form.elements['nova_cena'].value = a.nova_cena || '';
    form.elements['obrazok'].value = a.obrazok || '';
    form.elements['tagy'].value = (a.tagy || []).join(', ');

    zlava.checked = !!(a.nova_cena && String(a.nova_cena).trim() !== '');
    toggleZlavaUI();

    fileEl.value = '';
    renderPreview();
    setFormMode('edit', index);

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function onDelete(index) {
    if (!confirm('Naozaj vymazať toto auto?')) return;

    try {
      const r = await fetch(apiUrl(`/api/cars?index=${index}`), { method: 'DELETE' });

      if (!r.ok) {
        const t = await r.text().catch(() => '');
        console.error('Delete failed:', r.status, t);
        alert('Vymazanie zlyhalo (' + r.status + '). Pozri konzolu.');
        return;
      }

      await loadFromApi();
      setFormMode('create');

    } catch (err) {
      console.error(err);
      alert('Vymazanie zlyhalo (chyba siete alebo servera).');
    }
  }

  async function onDeleteSelected() {
    const checked = [...document.querySelectorAll('.row-check:checked')];

    if (checked.length === 0) {
      alert('Nevybral si žiadne autá.');
      return;
    }

    if (!confirm(`Naozaj vymazať ${checked.length} áut?`)) return;

    const indexes = checked
      .map(ch => parseInt(ch.dataset.index, 10))
      .filter(n => !Number.isNaN(n))
      .sort((a, b) => b - a);

    try {
      for (const idx of indexes) {
        const r = await fetch(apiUrl(`/api/cars?index=${idx}`), { method: 'DELETE' });
        if (!r.ok) {
          const t = await r.text().catch(() => '');
          console.error('Delete failed:', r.status, t);
          alert('Vymazanie zlyhalo (' + r.status + '). Pozri konzolu.');
          return;
        }
      }

      await loadFromApi();
      setFormMode('create');

    } catch (err) {
      console.error(err);
      alert('Vymazanie zlyhalo (chyba siete alebo servera).');
    }
  }

  // =============================
  // UTILS
  // =============================
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Nepodarilo sa načítať súbor.'));
      reader.onload = () => {
        const result = reader.result; // data:*;base64,xxxx
        const base64 = String(result).split(',')[1];
        resolve(base64);
      };
      reader.readAsDataURL(file);
    });
  }
</script>


</body>
</html>
